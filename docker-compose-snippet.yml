# snippet to be added to an existing docker-compose.yml media stack
services:
  yt-jellyfin-downloader:
    build: 
      # Path to the cloned repository directory relative to this docker-compose.yml
      context: ./youtube-archive
      dockerfile: Dockerfile
    container_name: yt-jellyfin-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Optional: Initial credentials are auto-migrated into /app/data/auth.json on first run.
      # Once migrated, credentials persist in the data volume and can be changed in the web UI.
      - APP_USERNAME=admin
      - APP_PASSWORD=supersecretpassword
    volumes:
      # Persistent storage for authentication credentials (auth.json)
      - ./data:/app/data
      # Map your host media library directory to /app/media inside the container
      - /path/to/your/jellyfin/youtube/library:/app/media
