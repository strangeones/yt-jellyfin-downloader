<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to Jellyfin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>YT to Jellyfin</h1>
            <p>Download and queue videos with perfect metadata.</p>
        </header>

        <form id="download-form">
            <div class="input-group">
                <input type="url" id="url-input" placeholder="https://youtube.com/watch?v=..." required>
                <button type="submit" id="submit-btn">
                    <span>Queue</span>
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
            </div>
            <div class="options-group">
                <label class="toggle-switch">
                    <input type="checkbox" id="playlist-toggle">
                    <span class="slider"></span>
                    <span class="label-text">Download entire playlist/mix</span>
                </label>
            </div>
            <div id="form-message"></div>
        </form>

        <div class="status-section">
            <div class="status-card">
                <h2>Now Downloading</h2>
                <div id="current-task" class="task-list">
                    <p class="empty-state">No active downloads</p>
                </div>
            </div>

            <div class="status-card">
                <h2>Queued <span id="queue-count" class="badge">0</span></h2>
                <div id="queued-tasks" class="task-list">
                    <p class="empty-state">Queue is empty</p>
                </div>
            </div>

            <div class="status-card">
                <h2>History</h2>
                <div id="history-tasks" class="task-list">
                    <p class="empty-state">No history</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
