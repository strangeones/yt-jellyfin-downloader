<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to Jellyfin</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container glass-panel">
        <header>
            <h1>YT to Jellyfin</h1>
            <p>Download and queue videos with perfect metadata.</p>
        </header>

        <form id="download-form">
            <div class="input-group">
                <input type="url" id="url-input" placeholder="https://youtube.com/watch?v=..." aria-label="YouTube URL" required>
                <button type="submit" id="submit-btn" aria-label="Queue Download">
                    <span>Queue</span>
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
            </div>
            <div class="options-group">
                <div class="segmented-control" role="radiogroup" aria-label="Download Mode">
                    <input type="radio" name="download-mode" id="mode-single" value="single" checked>
                    <label for="mode-single" class="segment-label" id="label-mode-single">Single Video</label>

                    <input type="radio" name="download-mode" id="mode-playlist" value="playlist">
                    <label for="mode-playlist" class="segment-label" id="label-mode-playlist">Playlist/Mix</label>

                    <input type="radio" name="download-mode" id="mode-channel" value="channel">
                    <label for="mode-channel" class="segment-label" id="label-mode-channel">Channel</label>
                </div>
            </div>

            <div id="channel-options" class="channel-options hidden" aria-label="Channel Options">
                <div class="date-pickers-container">
                    <div class="date-picker-card">
                        <label for="date-from" class="date-label">From Date</label>
                        <input type="date" id="date-from" class="date-input">
                    </div>
                    <div class="date-picker-card">
                        <label for="date-to" class="date-label">To Date</label>
                        <input type="date" id="date-to" class="date-input">
                    </div>
                </div>
                <div class="media-filters-container">
                    <span class="media-filters-title">Media Types</span>
                    <div class="media-checkbox-group">
                        <label class="media-checkbox-label" for="media-all">
                            <input type="checkbox" id="media-all" checked>
                            <span class="checkbox-text">All Media</span>
                        </label>
                        <label class="media-checkbox-label disabled" for="media-videos">
                            <input type="checkbox" id="media-videos" disabled>
                            <span class="checkbox-text">Videos</span>
                        </label>
                        <label class="media-checkbox-label disabled" for="media-shorts">
                            <input type="checkbox" id="media-shorts" disabled>
                            <span class="checkbox-text">Shorts</span>
                        </label>
                        <label class="media-checkbox-label disabled" for="media-streams">
                            <input type="checkbox" id="media-streams" disabled>
                            <span class="checkbox-text">Live Streams</span>
                        </label>
                    </div>
                </div>
            </div>
            <div id="form-message" aria-live="polite"></div>
        </form>

        <section class="status-section" aria-label="Download Status">
            <div class="status-card">
                <h2>Now Downloading</h2>
                <div id="current-task" class="task-list" aria-live="polite">
                    <p class="empty-state">No active downloads</p>
                </div>
            </div>

            <div class="status-card">
                <h2>Queued <span id="queue-count" class="badge">0</span></h2>
                <div id="queued-tasks" class="task-list" aria-live="polite">
                    <p class="empty-state">Queue is empty</p>
                </div>
            </div>

            <div class="status-card">
                <h2>History</h2>
                <div id="history-tasks" class="task-list">
                    <p class="empty-state">No history</p>
                </div>
            </div>
        </section>
    </main>

    <div id="confirmation-modal" class="modal-backdrop hidden">
        <div class="modal-content glass-panel">
            <h2 id="modal-title">Playlist Details</h2>
            <p id="modal-text">Fetching playlist info...</p>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
                <button id="modal-confirm-btn" class="btn-primary">Queue All</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
